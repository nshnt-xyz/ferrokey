[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nshnt-xyz/ferrokey"

[workspace.dependencies]
ferrokey-protocol = { path = "crates/ferrokey-protocol" }
ferrokey-input = { path = "crates/ferrokey-input" }
ferrokey-net = { path = "crates/ferrokey-net" }
uniffi = "0.32"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
