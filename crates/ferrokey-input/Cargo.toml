[package]
name = "ferrokey-input"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ferrokey-protocol.workspace = true

[features]
default = ["screen"]
# Screen sharing on Linux, which links against libpipewire (build-time
# package: libpipewire-0.3-dev on Debian/Ubuntu, pipewire-devel on Fedora).
screen = ["dep:pipewire"]

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
pipewire = { version = "0.9", optional = true }
reis = { version = "0.7", features = ["tokio"] }
# Already a dependency of reis; used for CLOCK_MONOTONIC frame timestamps.
rustix = { version = "1", features = ["time"] }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }

[lints]
workspace = true
